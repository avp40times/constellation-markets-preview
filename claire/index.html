:root{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#f6f2ea;color:#1c1a16;font-family:'LP','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.hidden{display:none!important}
.spin{height:100%;display:flex;align-items:center;justify-content:center}
.spin i{width:26px;height:26px;border:3px solid #d2b985;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 28px}
.card{width:100%;max-width:400px;background:#fffdf8;border:1px solid rgba(60,45,20,.13);border-radius:14px;padding:44px 36px 36px;
  box-shadow:0 1px 2px rgba(60,45,20,.06),0 18px 40px -22px rgba(60,45,20,.28);text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;color:#1c1a16}
.mark{width:64px;height:54px}
.word{font-size:17px;font-weight:500;letter-spacing:4px;line-height:1.1;direction:ltr}
.word small{display:block;font-size:13px;letter-spacing:8px;color:#885d0f;margin-top:6px;padding-left:8px}
.rule{width:28px;height:2px;background:#b8893a;margin:24px auto 14px;border-radius:2px}
.sub{margin:0 0 26px;font-size:15px;color:#34302a;letter-spacing:.2px}
form{text-align:start}
.field{position:relative;margin-bottom:14px}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;color:#1c1a16;background:#fff;border:1px solid #cfc4ad;border-radius:9px;padding:13px 46px 13px 14px;outline:0}
[dir=rtl] input[type=password],[dir=rtl] input[type=text]{padding:13px 14px 13px 46px}
input[type=password]::placeholder{color:#6a6458}
input[type=password]:focus,input[type=text]:focus{border-color:#885d0f;box-shadow:0 0 0 3px rgba(136,93,15,.18)}
.eye{position:absolute;top:50%;inset-inline-end:0;transform:translateY(-50%);width:20px;height:20px;padding:13px;box-sizing:content-box;cursor:pointer;opacity:.6}
.eye:hover{opacity:.9}
label.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:0 0 18px;font-size:14px;color:#34302a;cursor:pointer}
label.staticrypt-remember input{width:17px;height:17px;margin:0;accent-color:#885d0f}
.go{width:100%;font:inherit;font-size:16px;font-weight:500;letter-spacing:.3px;color:#fffdf8;background:#885d0f;border:0;border-radius:9px;padding:13px;cursor:pointer}
.go:hover,.go:active{background:#6f4a0b}
.go:focus-visible,.eye:focus-visible{outline:3px solid rgba(136,93,15,.35);outline-offset:2px}
.err{margin:14px 0 0;font-size:14px;color:#9a3412;text-align:center}
.foot{margin:26px 0 0;max-width:420px;text-align:center;font-size:12.5px;color:#5b564d;letter-spacing:.1px}
@media(max-width:420px){.wrap{padding:28px 14px 22px}.card{padding:36px 22px 28px}}
@media(prefers-reduced-motion:reduce){.spin i{animation:none}}
